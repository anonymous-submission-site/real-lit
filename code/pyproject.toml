[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n26"
version = "0.1.0"
description = "Benchmark"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Anonymous Submission", email = "a@b.com"}]
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
]
torch = [
  "torch>=2.2",
]
tabular = [
  "tabpfn>=0.1.10",
  "miceforest>=5.7",
]
runpod = [
  "requests>=2.31",
  "runpod>=1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that take > 5 seconds",
  "real_models: tests that need TabPFN/TabICL/TabDPT checkpoints",
]

[tool.ruff]
line-length = 100
target-version = "py311"
